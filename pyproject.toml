[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-risk-scoring-system"
version = "0.1.0"
description = "Corporate HR Talent Risk Scoring & 2x2 Matrix System for Attrition and Promotion Prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "shap>=0.42.0",
    "mlflow>=2.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "prefect>=2.10.0",
    "evidently>=0.4.0",
    "scipy>=1.10.0",
    "pytest>=7.3.0",
    "requests>=2.31.0",
    "pyarrow>=12.0.0",
    "httpx>=0.24.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
